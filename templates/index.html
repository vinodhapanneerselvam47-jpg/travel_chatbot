<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TRAVEL_CHATBOT</title>

    <style>
        :root {
            --background: #07141f;
            --surface: rgba(13, 31, 45, 0.94);
            --surface-light: rgba(255, 255, 255, 0.06);
            --border: rgba(255, 255, 255, 0.11);
            --text: #effaff;
            --muted: #91a9ba;
            --accent: #48dbc8;
            --accent-blue: #759fff;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            padding: 20px;
            display: grid;
            place-items: center;
            font-family: Inter, Arial, sans-serif;
            color: var(--text);
            background:
                radial-gradient(circle at 10% 10%, rgba(72, 219, 200, 0.16), transparent 28%),
                radial-gradient(circle at 90% 90%, rgba(117, 159, 255, 0.16), transparent 30%),
                var(--background);
        }

        .chatbot {
            width: min(980px, 100%);
            height: min(820px, 94vh);
            min-height: 560px;
            display: grid;
            grid-template-rows: auto 1fr auto;
            overflow: hidden;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 30px;
            box-shadow: 0 28px 80px rgba(0, 0, 0, 0.38);
            backdrop-filter: blur(18px);
        }

        .header {
            padding: 22px 26px;
            display: flex;
            align-items: center;
            gap: 15px;
            border-bottom: 1px solid var(--border);
        }

        .logo {
            width: 54px;
            height: 54px;
            display: grid;
            place-items: center;
            border-radius: 18px;
            font-size: 26px;
            background: linear-gradient(135deg, var(--accent), var(--accent-blue));
            box-shadow: 0 12px 30px rgba(72, 219, 200, 0.18);
        }

        .brand h1 {
            margin: 0;
            font-size: 20px;
            letter-spacing: 0.5px;
        }

        .status {
            margin-top: 5px;
            color: var(--muted);
            font-size: 13px;
        }

        .status-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            margin-right: 6px;
            border-radius: 50%;
            background: var(--accent);
        }

        .chat {
            padding: 26px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
            scroll-behavior: smooth;
        }

        .message {
            max-width: 78%;
            padding: 14px 17px;
            line-height: 1.55;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
            border: 1px solid var(--border);
            border-radius: 18px;
        }

        .bot {
            align-self: flex-start;
            background: var(--surface-light);
            border-top-left-radius: 6px;
        }

        .user {
            align-self: flex-end;
            background: linear-gradient(
                135deg,
                rgba(72, 219, 200, 0.20),
                rgba(117, 159, 255, 0.18)
            );
            border-top-right-radius: 6px;
        }

        .typing {
            color: var(--muted);
            font-size: 13px;
            padding: 0 5px;
        }

        .footer {
            padding: 18px 22px 22px;
            border-top: 1px solid var(--border);
        }

        .input-area {
            display: flex;
            gap: 10px;
            padding: 8px;
            background: rgba(255, 255, 255, 0.045);
            border: 1px solid var(--border);
            border-radius: 20px;
        }

        textarea {
            flex: 1;
            min-height: 46px;
            max-height: 130px;
            padding: 12px 13px;
            resize: none;
            border: 0;
            outline: 0;
            background: transparent;
            color: var(--text);
            font: inherit;
        }

        textarea::placeholder {
            color: #748b9d;
        }

        button {
            align-self: flex-end;
            padding: 13px 18px;
            border: 0;
            border-radius: 15px;
            cursor: pointer;
            color: #061119;
            font-weight: 800;
            background: linear-gradient(135deg, var(--accent), #91e9df);
            transition: transform 0.15s ease, opacity 0.15s ease;
        }

        button:hover {
            transform: translateY(-1px);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        @media (max-width: 650px) {
            body {
                padding: 0;
            }

            .chatbot {
                width: 100%;
                height: 100vh;
                min-height: 100vh;
                border-radius: 0;
            }

            .header {
                padding: 18px;
            }

            .chat {
                padding: 18px;
            }

            .footer {
                padding: 14px;
            }

            .message {
                max-width: 88%;
            }

            button {
                padding: 12px 14px;
            }
        }
    </style>
</head>

<body>
    <main class="chatbot">
        <header class="header">
            <div class="logo">✈</div>

            <div class="brand">
                <h1>TRAVEL_CHATBOT</h1>
                <div class="status">
                    <span class="status-dot"></span>
                    Your travel planning assistant
                </div>
            </div>
        </header>

        <section class="chat" id="chat" aria-live="polite">
            <div class="message bot">
                Hi! I'm TRAVEL_CHATBOT. I can help with destinations, itineraries, transportation, accommodation, packing, budgets, and travel planning.
            </div>
        </section>

        <footer class="footer">
            <form class="input-area" id="chatForm">
                <textarea
                    id="message"
                    rows="1"
                    placeholder="Ask a travel question..."
                    aria-label="Travel question"
                ></textarea>

                <button id="sendButton" type="submit">
                    Send
                </button>
            </form>
        </footer>
    </main>

    <script>
        const form = document.getElementById("chatForm");
        const input = document.getElementById("message");
        const chat = document.getElementById("chat");
        const sendButton = document.getElementById("sendButton");

        function addMessage(text, type) {
            const message = document.createElement("div");
            message.className = `message ${type}`;
            message.textContent = text;

            chat.appendChild(message);
            chat.scrollTop = chat.scrollHeight;
        }

        function showTyping() {
            const typing = document.createElement("div");

            typing.id = "typing";
            typing.className = "typing";
            typing.textContent = "TRAVEL_CHATBOT is thinking...";

            chat.appendChild(typing);
            chat.scrollTop = chat.scrollHeight;
        }

        function hideTyping() {
            document.getElementById("typing")?.remove();
        }

        input.addEventListener("input", () => {
            input.style.height = "auto";
            input.style.height = `${Math.min(input.scrollHeight, 130)}px`;
        });

        input.addEventListener("keydown", (event) => {
            if (event.key === "Enter" && !event.shiftKey) {
                event.preventDefault();
                form.requestSubmit();
            }
        });

        form.addEventListener("submit", async (event) => {
            event.preventDefault();

            const message = input.value.trim();

            if (!message || sendButton.disabled) {
                return;
            }

            addMessage(message, "user");

            input.value = "";
            input.style.height = "auto";
            sendButton.disabled = true;
            showTyping();

            try {
                const response = await fetch("/chat", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({ message })
                });

                const data = await response.json();

                hideTyping();

                if (!response.ok) {
                    addMessage(
                        data.error || "Something went wrong.",
                        "bot"
                    );
                    return;
                }

                addMessage(data.reply, "bot");
            } catch {
                hideTyping();

                addMessage(
                    "Unable to connect to the chatbot right now.",
                    "bot"
                );
            } finally {
                sendButton.disabled = false;
                input.focus();
            }
        });
    </script>
</body>
</html>
